<!-- ============================================================
     SIR WADE — 00 HEAD
     PASTE INTO: Kajabi → Site Settings → Custom Code → Head
     (site-wide), or Page Settings → Custom Code → Head for this
     page only.

     This is the ONLY block that loads CSS/JS. Every section block
     is pure markup, so without this the page renders unstyled.
     Paste it first.

     REQUIRED vs OPTIONAL
     Only two parts are required: the Google Fonts <link> and the
     jsDelivr <link>/<script> at the bottom. The SW_ASSETS and
     :root blocks in between are empty placeholders — they exist so
     you can override media and theme tokens from Kajabi later. The
     page works fine if you delete them.

     Prefer the Head setting: <link> and <script> do work inside a
     body-level Custom Code block, but the page will flash unstyled
     before the CSS lands.
     ============================================================ -->

<!-- ── Fonts ────────────────────────────────────────────────
     Permanent Marker stands in for the slanted brand marker face,
     Poppins for the rounded body sans. To swap in the real brand
     font: load it here, then override --sw-font-display below. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
  rel="stylesheet"
/>

<!-- ── Styles + behaviour ───────────────────────────────────
     Pinned to the v1.3.0 tag. A tag is immutable, so jsDelivr caches it
     hard and it can never change under the live site.

     After pushing a new tag, bump BOTH version numbers below.
     See README.md → "Releasing a new version".

     While iterating you can swap @v1.3.0 for @main to pick up the
     latest commit — but jsDelivr caches floating refs for up to 12h,
     so purge after each push:
       https://purge.jsdelivr.net/gh/brian-d-v/sir_wade_webpage@main/dist/sirwade.css -->
